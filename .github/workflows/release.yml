name: Build and publish extensions
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-main
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TMPDIR: ${{ github.workspace }}/.codex-work/tmp
      TMP: ${{ github.workspace }}/.codex-work/tmp
      TEMP: ${{ github.workspace }}/.codex-work/tmp
      XDG_CACHE_HOME: ${{ github.workspace }}/.codex-work/cache
      npm_config_cache: ${{ github.workspace }}/.codex-work/cache/npm
      NODE_COMPILE_CACHE: ${{ github.workspace }}/.codex-work/cache/node
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p .codex-work/tmp .codex-work/cache .codex-work/build
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned pnpm in project cache
        run: |
          npm install --prefix .codex-work/cache/pnpm-cli --no-package-lock --ignore-scripts pnpm@11.22.0
          echo "$GITHUB_WORKSPACE/.codex-work/cache/pnpm-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - name: Set release version
        run: |
          BASE=$(node -p "require('./package.json').version")
          echo "COCOS_RELEASE_TAG=v${BASE}-build.${GITHUB_RUN_NUMBER}.${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
      - run: pnpm check
      - run: node scripts/project-env.mjs node scripts/release-bundle.mjs
      - name: Publish tested version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$COCOS_RELEASE_TAG" .codex-work/build/releases/*.json --target "$GITHUB_SHA" --title "CocosMCP $COCOS_RELEASE_TAG" --notes "Automated build from main commit $GITHUB_SHA. Reload the extension after installation." --latest
