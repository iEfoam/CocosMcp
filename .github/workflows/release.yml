name: Build and publish extensions
on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      release: true
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: .codex-work/build/releases
      - name: Verify transferred bytes
        working-directory: .codex-work/build/releases
        run: sha256sum --check SHA256SUMS
      - name: Publish tested version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COCOS_RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          COCOS_RELEASE_CHANNEL: ${{ needs.verify.outputs.channel }}
        run: |
          FLAGS=(--prerelease --latest=false)
          if [[ "$COCOS_RELEASE_CHANNEL" == stable ]]; then FLAGS=(--verify-tag --latest); fi
          gh release create "$COCOS_RELEASE_TAG" .codex-work/build/releases/*.json .codex-work/build/releases/*.zip .codex-work/build/releases/SHA256SUMS --target "$GITHUB_SHA" --title "CocosMCP $COCOS_RELEASE_TAG" --notes-file .codex-work/build/releases/release-notes.md "${FLAGS[@]}"
